<!doctype html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="IMG_5704.jpeg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Outdoor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1410" media="(prefers-color-scheme: dark)">
<title>Outdoor Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one column. Header, sky card with current conditions, activity chips,
     best-time card with score ring, scrollable hourly bars, then the 7-day list.
     Colour: leaf green accent, soft sky tints, semantic good/fair/poor kept separate. */
  :root {
    --display: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
    --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --bg: #edf2ec;
    --surface: #ffffff;
    --surface2: #f3f7f2;
    --fg: #14241b;
    --muted: #587062;
    --line: #dbe4da;
    --accent: #1c7c54;
    --on-accent: #ffffff;
    --good: #23885a;
    --fair: #b9820f;
    --poor: #c1473b;
    --cool: #4f9bb8;
    --hero1: #dcefe2;
    --hero2: #cbe3ec;
    --hero-fg: #10271c;
    --shadow: 0 1px 2px rgba(20, 36, 27, .05), 0 10px 28px rgba(20, 36, 27, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1410; --surface: #141f19; --surface2: #1a2820; --fg: #e7f0ea; --muted: #8fa699;
      --line: #233329; --accent: #5ec794; --on-accent: #0c1410; --good: #5ec794; --fair: #e3b44f;
      --poor: #ee7d70; --cool: #6ab8d4; --hero1: #1c3a2c; --hero2: #183241; --hero-fg: #e8f3ec;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1410; --surface: #141f19; --surface2: #1a2820; --fg: #e7f0ea; --muted: #8fa699;
    --line: #233329; --accent: #5ec794; --on-accent: #0c1410; --good: #5ec794; --fair: #e3b44f;
    --poor: #ee7d70; --cool: #6ab8d4; --hero1: #1c3a2c; --hero2: #183241; --hero-fg: #e8f3ec;
    --shadow: none; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 var(--body);
    -webkit-text-size-adjust: 100%;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .head > div:first-child { min-width: 0; }
  .eyebrow { margin: 0; color: var(--muted); font-size: .82rem; font-weight: 500; }
  h1 { margin: 2px 0 0; font: 700 1.7rem/1.1 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .tools { display: flex; gap: 8px; flex: none; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; padding: 0;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  /* search */
  .panel { display: flex; flex-direction: column; gap: 8px; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 11px 14px;
  }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .results { display: flex; flex-direction: column; gap: 6px; }
  .results button {
    text-align: left; border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 10px 14px;
  }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 16px 18px 6px; }
  .card-h h2 { margin: 0; font: 700 1rem var(--display); letter-spacing: -.01em; }
  .card-h span { color: var(--muted); font-size: .82rem; }

  /* hero */
  .hero {
    border-radius: 24px; padding: 20px 20px 18px; color: var(--hero-fg);
    background: linear-gradient(160deg, var(--hero1), var(--hero2));
    display: flex; flex-direction: column; gap: 18px;
  }
  .hero.night { --hero1: #17303a; --hero2: #0e1d29; --hero-fg: #eaf3f1; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .temp { font: 600 4.8rem/.92 var(--display); letter-spacing: -.05em; }
  .cond { font-weight: 600; font-size: 1.05rem; margin-top: 6px; }
  .feels { font-size: .88rem; opacity: .75; }
  .hero-ico { width: 72px; height: 72px; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: color-mix(in srgb, var(--hero-fg) 9%, transparent); border-radius: 14px; padding: 9px 10px; min-width: 0; }
  .stat small { display: block; font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
  .stat b { font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sun { font-size: .82rem; opacity: .75; font-variant-numeric: tabular-nums; }

  .welcome { padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; }
  .welcome h2 { margin: 0; font: 700 1.45rem/1.15 var(--display); letter-spacing: -.02em; }
  .welcome p { margin: 0; color: var(--muted); }

  /* chips */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; margin-inline: -2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; white-space: nowrap; font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

  /* best */
  .best { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; padding: 18px; }
  .ring { width: 88px; height: 88px; display: block; }
  .ring-n { font: 700 24px var(--display); fill: var(--fg); }
  .best .label { font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .best .time { font: 700 1.75rem/1.15 var(--display); letter-spacing: -.02em; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .best .facts { color: var(--muted); font-size: .88rem; }
  .verdict { font-weight: 700; }
  .good { color: var(--good); } .fair { color: var(--fair); } .poor { color: var(--poor); }

  .badge { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-block; }
  .badge.good { background: color-mix(in srgb, var(--good) 16%, transparent); }
  .badge.fair { background: color-mix(in srgb, var(--fair) 16%, transparent); }
  .badge.poor { background: color-mix(in srgb, var(--poor) 16%, transparent); }

  /* hourly */
  .strip { display: flex; gap: 2px; overflow-x: auto; padding: 4px 10px 10px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .col {
    flex: 0 0 48px; display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 9px 0 8px; border: 0; border-radius: 14px; background: transparent;
  }
  .col[aria-pressed="true"] { background: var(--surface2); box-shadow: inset 0 0 0 1px var(--line); }
  .col .t { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .col .track { width: 14px; height: 78px; border-radius: 7px; background: var(--line); display: flex; align-items: flex-end; overflow: hidden; }
  .col .fill { width: 100%; border-radius: 7px; }
  .col .deg { font-size: .85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .detail { border-top: 1px solid var(--line); padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 4px; }
  .detail .d-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .detail .d-top strong { font: 700 1.1rem var(--display); font-variant-numeric: tabular-nums; }
  .detail .d-note { font-weight: 600; }
  .detail .d-facts { color: var(--muted); font-size: .86rem; }

  /* week */
  .day {
    display: grid; grid-template-columns: 4.3rem 2.1rem minmax(0, 1fr) 3rem; gap: 10px; align-items: center;
    width: 100%; text-align: left; padding: 10px 18px; border: 0; border-top: 1px solid var(--line); background: transparent;
  }
  .day:first-of-type { border-top: 0; }
  .day[aria-current="true"] { background: var(--surface2); }
  .day .nm { font-weight: 700; line-height: 1.2; }
  .day .dt { display: block; color: var(--muted); font-size: .76rem; font-weight: 400; }
  .day .ic { display: flex; flex-direction: column; align-items: center; min-height: 2.2rem; justify-content: center; }
  .day .ic svg { width: 24px; height: 24px; }
  .day .rain { font-size: .68rem; color: var(--cool); font-weight: 700; line-height: 1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .range { display: flex; align-items: center; gap: 8px; font-size: .86rem; font-variant-numeric: tabular-nums; }
  .range .lo { color: var(--muted); width: 2rem; text-align: right; }
  .range .hi { font-weight: 600; width: 2rem; }
  .rtrack { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--line); min-width: 24px; }
  .rfill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--cool), var(--fair)); }
  .day .sc { text-align: right; }

  .msg { color: var(--muted); padding: 22px 6px; text-align: center; }
  .err { color: var(--poor); }
  .foot { color: var(--muted); font-size: .76rem; text-align: center; margin: 4px 0 0; }
  .foot a { color: inherit; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) {
    .rfill, .col .fill { transition: height .25s ease, width .25s ease; }
  }
  @media (max-width: 380px) {
    .temp { font-size: 4rem; }
    .day { grid-template-columns: 3.8rem 1.8rem minmax(0, 1fr) 2.8rem; gap: 8px; padding-inline: 14px; }
  }
</style>
</head>
<body>
<main>
  <header class="head">
    <div>
      <p class="eyebrow" id="eyebrow">Outdoor Weather</p>
      <h1 id="place">Where to?</h1>
    </div>
    <div class="tools">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search a city" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="icon-btn" id="gpsBtn" type="button" aria-label="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>
  </header>

  <div class="panel" id="searchPanel" hidden>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" type="search" placeholder="Search a city" aria-label="Search a city" enterkeyhint="search">
      <button class="btn primary" type="submit">Search</button>
    </form>
    <div class="results" id="results" hidden></div>
  </div>

  <section id="hero"></section>
  <div class="chips" id="chips" role="group" aria-label="Activity"></div>
  <section class="card" id="best" hidden></section>
  <section class="card" id="hourly" hidden></section>
  <section class="card" id="week" hidden></section>

  <p class="foot">Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>. Scores are estimates from feels-like temperature, rain chance, wind, UV, cloud cover and visibility.</p>
</main>

<script>
(function () {
  "use strict";

  var ACTIVITIES = [
    { id: "running",    label: "Running",    temp: [8, 16],  wind: 30 },
    { id: "cycling",    label: "Cycling",    temp: [12, 22], wind: 20 },
    { id: "hiking",     label: "Hiking",     temp: [10, 20], wind: 30 },
    { id: "walking",    label: "Walking",    temp: [12, 24], wind: 30 },
    { id: "picnic",     label: "Picnic",     temp: [18, 27], wind: 25 },
    { id: "stargazing", label: "Stargazing", temp: [5, 20],  wind: 30 }
  ];

  var state = {
    activity: "running", place: null, cur: null, days: [], calc: [],
    dayIdx: 0, hourIdx: 0, nowLocal: "", fetchedAt: 0
  };

  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function recall(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function r0(n) { return Math.round(n); }
  function actObj() { return ACTIVITIES.filter(function (a) { return a.id === state.activity; })[0]; }

  // ---------- weather codes and icons ----------
  function wmo(c) {
    if (c === 0) return { k: "clear", l: "Clear sky" };
    if (c === 1) return { k: "clear", l: "Mostly clear" };
    if (c === 2) return { k: "partly", l: "Partly cloudy" };
    if (c === 3) return { k: "cloud", l: "Overcast" };
    if (c === 45 || c === 48) return { k: "fog", l: "Fog" };
    if (c >= 51 && c <= 57) return { k: "rain", l: "Drizzle" };
    if (c >= 61 && c <= 67) return { k: "rain", l: "Rain" };
    if (c >= 71 && c <= 77) return { k: "snow", l: "Snow" };
    if (c >= 80 && c <= 82) return { k: "rain", l: "Showers" };
    if (c === 85 || c === 86) return { k: "snow", l: "Snow showers" };
    if (c >= 95) return { k: "storm", l: "Thunderstorm" };
    return { k: "cloud", l: "Cloudy" };
  }

  var CLOUD = '<path d="M7 15h9.5a3.5 3.5 0 0 0 .5-6.96A5.5 5.5 0 0 0 6.4 9.2 3 3 0 0 0 7 15z"/>';
  var MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
  function rays(cx, cy, r1, r2) {
    var s = "";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
      s += '<path d="M' + (cx + c * r1).toFixed(2) + " " + (cy + n * r1).toFixed(2) +
           "L" + (cx + c * r2).toFixed(2) + " " + (cy + n * r2).toFixed(2) + '"/>';
    }
    return s;
  }
  function icon(kind, night) {
    var g = "";
    if (kind === "clear") g = night ? MOON : '<circle cx="12" cy="12" r="4"/>' + rays(12, 12, 6.6, 9);
    else if (kind === "partly") {
      g = (night ? '<g transform="translate(1,-1) scale(.6)">' + MOON + "</g>"
                 : '<circle cx="7.5" cy="7.5" r="2.5"/>' + rays(7.5, 7.5, 3.9, 5.1)) +
          '<g transform="translate(3,3.5)">' + CLOUD + "</g>";
    }
    else if (kind === "cloud") g = '<g transform="translate(0,2)">' + CLOUD + "</g>";
    else if (kind === "fog") g = '<path d="M4 8h16M3 12h18M5 16h14M8 20h8"/>';
    else if (kind === "rain") g = CLOUD + '<path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>';
    else if (kind === "snow") g = CLOUD + '<path d="M8 18.5v.01M12 20v.01M16 18.5v.01M10 21v.01M14 21.5v.01"/>';
    else if (kind === "storm") g = CLOUD + '<path d="M12.5 15.5l-2 3h3l-2 3"/>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + g + "</svg>";
  }

  // ---------- scoring ----------
  function scoreHour(h, a) {
    var s = 100, notes = [];
    var lo = a.temp[0], hi = a.temp[1], t = h.feels;
    if (t < lo) { s -= Math.min(40, (lo - t) * 4); notes.push("Cold"); }
    else if (t > hi) { s -= Math.min(40, (t - hi) * 4); notes.push("Hot"); }

    s -= (h.rain / 100) * 60;
    if (h.rain > 30) notes.push("Rain likely (" + h.rain + "%)");

    if (h.wind > a.wind) { s -= Math.min(30, (h.wind - a.wind) * 1.5); notes.push("Windy"); }
    if (a.id !== "stargazing" && h.uv >= 8) { s -= 15; notes.push("High UV"); }

    if (a.id === "stargazing") {
      if (h.isDay) return { score: 0, note: "Daylight" };
      s -= (h.cloud / 100) * 60;
      if (h.cloud > 50) notes.push("Cloudy");
    }
    if (h.vis < 3) { s -= 10; notes.push("Low visibility"); }

    s = Math.max(0, Math.min(100, Math.round(s)));
    return { score: s, note: notes.length ? notes.join(", ") : "Great conditions" };
  }
  function band(s) { return s >= 75 ? "good" : s >= 50 ? "fair" : "poor"; }
  function bandName(s) { return s >= 75 ? "Good" : s >= 50 ? "Fair" : "Poor"; }
  function bandColor(s) { return "var(--" + band(s) + ")"; }

  function bestWindow(sc) {
    var n = sc.length;
    if (!n) return { i: 0, avg: 0, len: 0 };
    if (n === 1) return { i: 0, avg: sc[0].score, len: 1 };
    var bi = 0, ba = -1;
    for (var i = 0; i < n - 1; i++) {
      var avg = (sc[i].score + sc[i + 1].score) / 2;
      if (avg > ba) { ba = avg; bi = i; }
    }
    return { i: bi, avg: ba, len: 2 };
  }

  function calcAll() {
    var a = actObj();
    state.calc = state.days.map(function (day) {
      var scored = day.hours.map(function (h) {
        var r = scoreHour(h, a);
        return { h: h, score: r.score, note: r.note };
      });
      return { scored: scored, w: bestWindow(scored) };
    });
  }

  // ---------- labels ----------
  function hh(t) { return t.slice(11, 16); }
  function endLabel(t) { return pad2((parseInt(t.slice(11, 13), 10) + 1) % 24) + ":00"; }
  function utcDate(d) { return new Date(d.slice(0, 10) + "T12:00:00Z"); }
  function weekday(d, long) {
    return utcDate(d).toLocaleDateString("en-GB", { weekday: long ? "long" : "short", timeZone: "UTC" });
  }
  function dayMonth(d) {
    return utcDate(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  }
  function dayTitle(i) { return i === 0 ? "Today" : i === 1 ? "Tomorrow" : weekday(state.days[i].date, true); }

  // ---------- data ----------
  function load(lat, lon, name) {
    state.place = { lat: lat, lon: lon, name: name };
    store("ow-place", state.place);
    $("place").textContent = name;
    $("searchPanel").hidden = true;
    $("searchBtn").setAttribute("aria-expanded", "false");
    ["best", "hourly", "week"].forEach(function (id) { $(id).hidden = true; });
    $("hero").innerHTML = '<p class="msg">Loading forecast...</p>';

    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m" +
      "&hourly=temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,uv_index,cloud_cover,visibility,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
      "&timezone=auto&forecast_days=7&wind_speed_unit=kmh";

    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("Forecast service returned " + r.status);
      return r.json();
    }).then(function (d) {
      var nowLocal = d.current && d.current.time
        ? d.current.time.slice(0, 13) + ":00"
        : new Date(Date.now() + d.utc_offset_seconds * 1000).toISOString().slice(0, 13) + ":00";
      var D = d.daily, H = d.hourly, byDate = {};

      state.days = D.time.map(function (date, i) {
        var day = {
          date: date, code: D.weather_code[i], tmax: D.temperature_2m_max[i], tmin: D.temperature_2m_min[i],
          rain: D.precipitation_probability_max[i] || 0,
          sunrise: D.sunrise[i].slice(11, 16), sunset: D.sunset[i].slice(11, 16), hours: []
        };
        byDate[date] = day;
        return day;
      });

      for (var i = 0; i < H.time.length; i++) {
        var t = H.time[i], day = byDate[t.slice(0, 10)];
        if (!day || t < nowLocal) continue;
        day.hours.push({
          time: t,
          temp: H.temperature_2m[i],
          feels: H.apparent_temperature[i],
          rain: H.precipitation_probability[i] || 0,
          wind: H.wind_speed_10m[i],
          uv: H.uv_index[i] || 0,
          cloud: H.cloud_cover[i] || 0,
          vis: (H.visibility[i] == null ? 20000 : H.visibility[i]) / 1000,
          isDay: H.is_day[i] === 1
        });
      }

      state.cur = d.current;
      state.nowLocal = nowLocal;
      state.fetchedAt = Date.now();
      state.dayIdx = 0;
      calcAll();
      state.hourIdx = state.calc[0].w.i;
      renderAll(true);
    }).catch(function (e) {
      $("hero").innerHTML = '<p class="msg err"></p>';
      $("hero").firstChild.textContent = "Could not load the forecast. Check your connection and try again. (" + e.message + ")";
    });
  }

  // ---------- render ----------
  function renderHero() {
    var c = state.cur, today = state.days[0];
    var first = today.hours[0] || { uv: 0, rain: 0 };
    var w = wmo(c.weather_code), night = c.is_day === 0;
    $("eyebrow").textContent = weekday(state.nowLocal, true) + " " + dayMonth(state.nowLocal) + " · updated " + state.nowLocal.slice(11, 16);
    $("hero").innerHTML =
      '<div class="hero card' + (night ? " night" : "") + '">' +
        '<div class="hero-top"><div>' +
          '<div class="temp">' + r0(c.temperature_2m) + '°</div>' +
          '<div class="cond">' + w.l + '</div>' +
          '<div class="feels">Feels like ' + r0(c.apparent_temperature) + '° · H ' + r0(today.tmax) + '° · L ' + r0(today.tmin) + '°</div>' +
        '</div><div class="hero-ico">' + icon(w.k, night) + '</div></div>' +
        '<div class="stats">' +
          '<div class="stat"><small>Wind</small><b>' + r0(c.wind_speed_10m) + ' km/h</b></div>' +
          '<div class="stat"><small>Humidity</small><b>' + r0(c.relative_humidity_2m) + '%</b></div>' +
          '<div class="stat"><small>UV</small><b>' + r0(first.uv) + '</b></div>' +
          '<div class="stat"><small>Rain</small><b>' + first.rain + '%</b></div>' +
        '</div>' +
        '<div class="sun">Sunrise ' + today.sunrise + ' · Sunset ' + today.sunset + '</div>' +
      '</div>';
  }

  function ring(score) {
    var c = 2 * Math.PI * 34, off = c * (1 - score / 100);
    return '<svg class="ring" viewBox="0 0 84 84" aria-hidden="true">' +
      '<circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="8"/>' +
      '<circle cx="42" cy="42" r="34" fill="none" stroke="' + bandColor(score) + '" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
      '<text x="42" y="50" text-anchor="middle" class="ring-n">' + score + "</text></svg>";
  }

  function factsLine(h) {
    return r0(h.feels) + "° feels like · " + h.rain + "% rain · " + r0(h.wind) + " km/h wind · UV " + r0(h.uv) + " · " + r0(h.cloud) + "% cloud";
  }

  function renderBest() {
    var a = actObj(), cd = state.calc[state.dayIdx], w = cd.w, el = $("best");
    var avg = r0(w.avg);
    el.hidden = false;
    if (!cd.scored.length || avg <= 0) {
      el.innerHTML = '<div class="best">' + ring(0) + '<div><div class="label">' + a.label + " · " + dayTitle(state.dayIdx) +
        '</div><div class="time">No good time</div><div class="facts">' +
        (a.id === "stargazing" ? "No dark hours left on this day." : "Conditions stay poor for the rest of this day.") + "</div></div></div>";
      return;
    }
    var s1 = cd.scored[w.i], s2 = cd.scored[w.i + 1] || s1;
    el.innerHTML = '<div class="best">' + ring(avg) + "<div>" +
      '<div class="label">Best for ' + a.label.toLowerCase() + " · " + dayTitle(state.dayIdx) + "</div>" +
      '<div class="time">' + hh(s1.h.time) + " – " + endLabel(s2.h.time) + "</div>" +
      '<div class="facts"><span class="verdict ' + band(avg) + '">' + bandName(avg) + "</span> · " + factsLine(s1.h) + "</div>" +
      "</div></div>";
  }

  function renderHourly(center) {
    var cd = state.calc[state.dayIdx], el = $("hourly");
    var old = el.querySelector(".strip"), keep = old ? old.scrollLeft : 0;
    el.hidden = false;
    if (!cd.scored.length) { el.innerHTML = '<p class="msg">No hours left today.</p>'; return; }
    if (state.hourIdx >= cd.scored.length) state.hourIdx = 0;

    var cols = cd.scored.map(function (r, i) {
      var label = (state.dayIdx === 0 && i === 0) ? "Now" : hh(r.h.time);
      return '<button class="col" type="button" data-hour="' + i + '" aria-pressed="' + (i === state.hourIdx) + '">' +
        '<span class="t">' + label + "</span>" +
        '<span class="track"><span class="fill" style="height:' + Math.max(r.score, 4) + "%;background:" + bandColor(r.score) + '"></span></span>' +
        '<span class="deg">' + r0(r.h.temp) + "°</span></button>";
    }).join("");

    var sel = cd.scored[state.hourIdx];
    el.innerHTML =
      '<div class="card-h"><h2>Hour by hour</h2><span>' + dayTitle(state.dayIdx) + " · bar height is the score</span></div>" +
      '<div class="strip">' + cols + "</div>" +
      '<div class="detail"><div class="d-top"><strong>' + hh(sel.h.time) + '</strong><span class="badge ' + band(sel.score) + '">' +
      sel.score + " · " + bandName(sel.score) + '</span></div><div class="d-note">' + sel.note +
      '</div><div class="d-facts">' + factsLine(sel.h) + "</div></div>";

    var strip = el.querySelector(".strip");
    if (center) {
      var b = strip.querySelector('[aria-pressed="true"]');
      if (b) strip.scrollLeft = Math.max(0, b.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2);
    } else {
      strip.scrollLeft = keep;
    }
  }

  function renderWeek() {
    var gmin = Infinity, gmax = -Infinity, el = $("week");
    state.days.forEach(function (d) { gmin = Math.min(gmin, d.tmin); gmax = Math.max(gmax, d.tmax); });
    var span = Math.max(gmax - gmin, 1);
    var a = actObj();

    var rows = state.days.map(function (d, i) {
      var w = wmo(d.code), cd = state.calc[i], sc = r0(cd.w.avg);
      var left = ((d.tmin - gmin) / span) * 100, width = Math.max(((d.tmax - d.tmin) / span) * 100, 6);
      var rain = d.rain >= 20 ? '<span class="rain">' + d.rain + "%</span>" : "";
      var score = cd.scored.length ? '<span class="badge ' + band(sc) + '">' + sc + "</span>" : "";
      return '<button class="day" type="button" data-day="' + i + '" aria-current="' + (i === state.dayIdx) + '">' +
        '<span class="nm">' + (i === 0 ? "Today" : weekday(d.date, false)) + '<span class="dt">' + dayMonth(d.date) + "</span></span>" +
        '<span class="ic">' + icon(w.k, false) + rain + "</span>" +
        '<span class="range"><span class="lo">' + r0(d.tmin) + '°</span><span class="rtrack"><span class="rfill" style="left:' +
        left.toFixed(1) + "%;width:" + width.toFixed(1) + '%"></span></span><span class="hi">' + r0(d.tmax) + "°</span></span>" +
        '<span class="sc">' + score + "</span></button>";
    }).join("");

    el.hidden = false;
    el.innerHTML = '<div class="card-h"><h2>7-day forecast</h2><span>Score for ' + a.label.toLowerCase() + "</span></div>" + rows;
  }

  function renderAll(center) {
    renderHero(); renderBest(); renderHourly(center); renderWeek();
  }
  function renderSelection(center) {
    renderBest(); renderHourly(center); renderWeek();
  }

  // ---------- activity chips ----------
  function drawChips() {
    var box = $("chips");
    box.innerHTML = "";
    ACTIVITIES.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = a.label;
      b.setAttribute("aria-pressed", String(a.id === state.activity));
      b.addEventListener("click", function () {
        state.activity = a.id; store("ow-activity", a.id);
        drawChips();
        if (state.days.length) {
          calcAll();
          state.hourIdx = state.calc[state.dayIdx].w.i;
          renderSelection(true);
        }
      });
      box.appendChild(b);
    });
  }

  // ---------- interactions ----------
  document.addEventListener("click", function (e) {
    var dayBtn = e.target.closest("[data-day]");
    if (dayBtn) {
      state.dayIdx = parseInt(dayBtn.getAttribute("data-day"), 10);
      state.hourIdx = state.calc[state.dayIdx].w.i;
      renderSelection(true);
      return;
    }
    var hourBtn = e.target.closest("[data-hour]");
    if (hourBtn) {
      state.hourIdx = parseInt(hourBtn.getAttribute("data-hour"), 10);
      renderHourly(false);
    }
  });

  function locate() {
    if (!navigator.geolocation) { showErr("This browser can't share your location. Search a city instead."); return; }
    $("gpsBtn").style.opacity = ".5";
    navigator.geolocation.getCurrentPosition(function (p) {
      $("gpsBtn").style.opacity = "";
      load(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3), "Your location");
    }, function () {
      $("gpsBtn").style.opacity = "";
      showErr("Location is blocked or unavailable. Allow it for this site in Settings, or search a city.");
    }, { timeout: 12000, maximumAge: 600000 });
  }
  function showErr(text) {
    $("hero").innerHTML = '<p class="msg err"></p>';
    $("hero").firstChild.textContent = text;
  }
  $("gpsBtn").addEventListener("click", locate);

  function toggleSearch(open) {
    var panel = $("searchPanel");
    panel.hidden = open === undefined ? !panel.hidden : !open;
    $("searchBtn").setAttribute("aria-expanded", String(!panel.hidden));
    if (!panel.hidden) $("q").focus();
  }
  $("searchBtn").addEventListener("click", function () { toggleSearch(); });

  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("q").value.trim(), results = $("results");
    if (!q) return;
    fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&name=" + encodeURIComponent(q))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        results.innerHTML = "";
        var list = d.results || [];
        results.hidden = false;
        if (!list.length) { results.innerHTML = '<p class="msg">No match. Try another spelling.</p>'; return; }
        list.forEach(function (c) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = c.name + (c.admin1 ? ", " + c.admin1 : "") + (c.country ? ", " + c.country : "");
          b.addEventListener("click", function () {
            results.hidden = true;
            $("q").value = "";
            load(c.latitude, c.longitude, c.name);
          });
          results.appendChild(b);
        });
      }).catch(function () {
        results.hidden = false;
        results.innerHTML = '<p class="msg err">Search failed. Check your connection.</p>';
      });
  });

  // refresh when the app comes back to the foreground after a while
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state.place && Date.now() - state.fetchedAt > 15 * 60000) {
      load(state.place.lat, state.place.lon, state.place.name);
    }
  });

  // ---------- start ----------
  var savedAct = recall("ow-activity");
  if (savedAct && ACTIVITIES.some(function (a) { return a.id === savedAct; })) state.activity = savedAct;
  drawChips();

  var saved = recall("ow-place");
  if (saved && saved.lat != null) {
    load(saved.lat, saved.lon, saved.name);
  } else {
    $("hero").innerHTML =
      '<div class="card welcome"><h2>When is the best time to be outside?</h2>' +
      "<p>Pick where you are and get a score for the next 7 days for running, cycling, hiking, walking, picnics and stargazing.</p>" +
      '<button class="btn primary" id="welcomeGps" type="button">Use my location</button></div>';
    $("welcomeGps").addEventListener("click", locate);
    toggleSearch(true);
  }
})();
</script>
</body>
</html>
